# Labels for jamly. This file is the source of truth; GitHub is kept in step with it.
#
# Agents read labels, not Project fields: a Claude cloud session can reach issues
# and labels through the REST API, but not GitHub Projects. So anything an agent
# needs to know or say about an issue's state is a label. Project fields are for
# Elia's planning only. See docs/process/42-project-board.md.

# --- Type: what kind of work. Exactly one per issue.
- name: 'type:feature'
  color: '1f6feb'
  description: A story a band can use
- name: 'type:bug'
  color: 'd73a4a'
  description: Something a musician hits that behaves wrongly
- name: 'type:chore'
  color: '6e7781'
  description: Tooling, CI, dependencies, repo setup — nothing user-visible
- name: 'type:docs'
  color: '0075ca'
  description: Documentation only
- name: 'type:audit'
  color: 'bf8700'
  description: Raised by the codebase auditor — a proposal, not yet accepted

# --- Agent state: the handshake between Elia and the agents.
- name: 'agent:ready'
  color: '2da44e'
  description: Spec is complete; an agent may pick this up
- name: 'agent:working'
  color: 'fbca04'
  description: An agent is on it — don't start a second one
- name: 'needs:elia'
  color: 'e99695'
  description: Blocked on Elia — a decision, an approval or a review
- name: 'needs:device-check'
  color: 'f9d0c4'
  description: Code is done; Elia must check it on iOS and Android, offline and in the dark

# --- Priority: within the current milestone.
- name: 'priority:now'
  color: 'b60205'
  description: Next thing to do
- name: 'priority:next'
  color: 'ff9f1c'
  description: After the current ones
- name: 'priority:later'
  color: 'c5def5'
  description: In scope, not urgent

# --- Epic: where in v0.1 this belongs (docs/product/11-mvp-scope.md).
- name: 'epic:A-getting-in'
  color: 'd4c5f9'
  description: Epic A — getting the band in
- name: 'epic:B-repertoire'
  color: 'd4c5f9'
  description: Epic B — the repertoire
- name: 'epic:C-events'
  color: 'd4c5f9'
  description: Epic C — rehearsals and gigs
- name: 'epic:D-setlists'
  color: 'd4c5f9'
  description: Epic D — setlists
- name: 'epic:E-performance'
  color: 'd4c5f9'
  description: Epic E — performance mode
- name: 'epic:F-platform'
  color: 'd4c5f9'
  description: Epic F — offline, stage-dark, measurement

# --- Area outside the product.
- name: 'area:harness'
  color: '5319e7'
  description: How agents work on this repo — CLAUDE.md, permissions, hooks, CI
